<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
/* 카카오톡·네이버·페이스북·인스타그램 등 인앱 브라우저에서 열리면 기본 브라우저로 다시 열기 */
(function () {
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|NAVER\(inapp|FBAN|FBAV|FB_IAB|Instagram|Line\/|DaumApps|everytimeApp|wv\)/i.test(ua);
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
    location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1'; return;
  }
  if (!inApp) return;
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; return;
  }
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(13,17,32,.94);color:#eef0f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 system-ui,sans-serif';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 일부 기능이 제대로 작동하지 않을 수 있어요.<br>⋯ 메뉴에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button id="copyUrl" style="font:inherit;padding:10px 18px;border-radius:999px;border:0;background:#eef0f8;color:#0d1120">주소 복사</button>' +
      '<button id="stayHere" style="font:inherit;background:none;border:0;color:#9aa3c0;text-decoration:underline">그냥 여기서 보기</button>';
    document.body.appendChild(box);
    document.getElementById('copyUrl').onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
        function () { b.textContent = '복사했어요'; }, function () { prompt('주소를 복사하세요', url); });
    };
    document.getElementById('stayHere').onclick = function () { box.remove(); };
  });
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10을 이용해 빼기</title>
<style>
:root{
  --bg:#f5f1e6; --ink:#2b2f3a; --muted:#8a8f9b; --line:#a9aebb;
  --col:#4f63d2; --colInk:#3446a8; --arrow:#e0218a; --pink:#fbd3e6; --mint:#d3f0e1;
  --box:#3b6fd1; --ok:#2e9e5b; --bad:#e0533d; --card:#fffdf8; --gold:#f2b632;
  --c:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* 가로 화면: 블록(위) · 가르기 그림과 식(가운데) · 숫자판(아래) */
#app{height:100%;display:grid;gap:1.3vmin;padding:max(1.3vmin,env(safe-area-inset-top)) 1.6vmin max(1.3vmin,env(safe-area-inset-bottom));
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,.62fr) minmax(0,1.38fr) clamp(64px,15vh,170px);
  grid-template-areas:"top" "cubes" "work" "pad"}

#top{grid-area:top;display:flex;align-items:center;gap:1.4vmin;min-height:clamp(46px,8vmin,90px)}
#stars{flex:none;display:flex;align-items:center;gap:.25em;font-weight:800;font-size:clamp(18px,3.6vmin,42px);
  background:var(--card);border-radius:999px;padding:.15em .6em;box-shadow:0 1px 0 #0001}
#stars i{color:var(--gold);font-style:normal}
#msg{flex:1;text-align:center;font-weight:700;font-size:clamp(17px,3.7vmin,46px);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#msg.hint{color:#b0452f}
#msg.yay{color:var(--ok)}
#modeChip{flex:none;font-weight:700;font-size:clamp(13px,2.3vmin,26px);background:#3b6fd1;color:#fff;border-radius:999px;padding:.3em .8em;white-space:nowrap}
#modeChip[hidden]{display:none}
#modeChip .short{display:none}
@media (max-width:600px){#modeChip .full{display:none}#modeChip .short{display:inline}#modeChip{padding:.3em .6em}}
#gear{flex:none;width:clamp(46px,7.5vmin,84px);height:clamp(46px,7.5vmin,84px);border-radius:50%;
  background:var(--card);font-size:clamp(22px,4vmin,44px);box-shadow:0 1px 0 #0001}

/* 연결모형: 10개 묶음 + 낱개 */
#cubes{grid-area:cubes;display:flex;align-items:center;justify-content:center;min-height:0}
.frame{display:flex;align-items:center;gap:calc(var(--c)*.5);padding:calc(var(--c)*.3) calc(var(--c)*.45);
  background:#fff;border:2px solid var(--line);border-radius:calc(var(--c)*.28);touch-action:none;transition:border-color .3s,box-shadow .3s}
.frame.two{display:grid;grid-template-columns:auto auto;column-gap:calc(var(--c)*.5);row-gap:calc(var(--c)*.35);justify-items:start}
.frame.two .cnt{grid-row:1/3}
.frame.pick{animation:breathe 1.6s ease-in-out infinite}
.frame.out{border-color:var(--bad);box-shadow:0 0 0 calc(var(--c)*.14) #e0533d44}
@keyframes breathe{50%{box-shadow:0 0 0 calc(var(--c)*.14) #4f63d233}}
.cnt{width:calc(var(--c)*1.3);text-align:center;font-weight:800;font-size:calc(var(--c)*.85);line-height:1;color:var(--colInk)}
.grp{display:flex;align-items:center;min-height:var(--c)}
.grp.bar{gap:0}
.grp.loose{gap:calc(var(--c)*.16)}
.grp.empty{display:none}
.frame.two .grp.empty{display:flex}
.cube{width:var(--c);height:var(--c);flex:none;position:relative;background:var(--col);border-radius:calc(var(--c)*.12);
  box-shadow:inset 0 calc(var(--c)*.14) 0 #ffffff40,inset 0 calc(var(--c)*-.08) 0 #00000026}
.grp.bar .cube{border-radius:0;box-shadow:inset 0 calc(var(--c)*.14) 0 #ffffff40,inset 0 calc(var(--c)*-.08) 0 #00000026,inset -1px 0 0 #00000040}
.grp.bar .cube:first-child{border-radius:calc(var(--c)*.12) 0 0 calc(var(--c)*.12)}
.grp.bar .cube:last-child{border-radius:0 calc(var(--c)*.12) calc(var(--c)*.12) 0}
.cube::after{content:"";position:absolute;inset:31%;border-radius:50%;background:#00000038;box-shadow:inset 0 2px 2px #00000040}
.cube.grab{cursor:grab}
/* 가르기 전: 14개가 한 줄로 붙은 한 덩어리 */
.grp{transition:gap .6s ease,margin .6s ease}
.frame.unsplit:not(.two) .grp.bar{margin-right:calc(var(--c)*-.5)}
.frame{transition:border-color .3s,box-shadow .3s,padding .6s ease}
.frame.unsplit:not(.two){padding-right:calc(var(--c)*(.45 + var(--ex,0)))}
.frame.unsplit .grp.loose{gap:0}
.frame.unsplit .grp.bar .cube:last-child{border-radius:0}
.frame.unsplit .grp.loose .cube{border-radius:0;box-shadow:inset 0 calc(var(--c)*.14) 0 #ffffff40,inset 0 calc(var(--c)*-.08) 0 #00000026,inset -1px 0 0 #00000040}
.frame.unsplit .grp.loose .cube:last-child{border-radius:0 calc(var(--c)*.12) calc(var(--c)*.12) 0}
.frame.unsplit.two .grp.loose .cube:first-child{border-radius:calc(var(--c)*.12) 0 0 calc(var(--c)*.12)}
/* 빼는 수 가르기: 10개 묶음과 낱개 막대 (낱개끼리는 붙어 있음) */
.frame.stick .grp.loose{gap:0}
.frame.stick .grp.loose .cube{border-radius:0;box-shadow:inset 0 calc(var(--c)*.14) 0 #ffffff40,inset 0 calc(var(--c)*-.08) 0 #00000026,inset -1px 0 0 #00000040}
.frame.stick .grp.loose .cube:first-child{border-radius:calc(var(--c)*.12) 0 0 calc(var(--c)*.12)}
.frame.stick .grp.loose .cube:last-child{border-radius:0 calc(var(--c)*.12) calc(var(--c)*.12) 0}
.frame.stick .grp.loose .cube:only-child{border-radius:calc(var(--c)*.12)}
.frame.stick:not(.two){padding-right:calc(var(--c)*(.45 + var(--ex2,0)))}
.frame.stick .grp.loose .cube.gone{box-shadow:inset -1px 0 0 #00000040}
/* 뺀 블록: 제자리에 흐리게 + 빗금 */
.cube{transition:opacity .3s}
.cube.gone{opacity:.32;box-shadow:none}
.cube.gone::before{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;
  background:repeating-linear-gradient(-45deg,transparent 0 calc(var(--c)*.1),#1d2030 calc(var(--c)*.1) calc(var(--c)*.17))}
.grp.bar .cube.gone{box-shadow:inset -1px 0 0 #00000040}
/* 답 단계: 남은 블록에 금색 테두리 */
.cube.keep{outline:calc(var(--c)*.07) solid var(--gold);outline-offset:calc(var(--c)*-.02);z-index:2}
.fly{position:fixed;z-index:50;margin:0;pointer-events:none}
.drag{position:fixed;z-index:55;margin:0;pointer-events:none;transform:scale(1.15);box-shadow:0 8px 16px #0004;border-radius:calc(var(--c)*.12)}
.blink{animation:blink .7s ease-in-out infinite alternate}
@keyframes blink{from{opacity:1;transform:none}to{opacity:.35;transform:translateY(-8%)}}

/* 가르기 그림 + 식 */
#work{grid-area:work;display:flex;flex-direction:row;min-height:0;background:var(--card);border-radius:2vmin;box-shadow:0 1px 0 #0001;padding:1vmin}
#diaWrap{flex:1.35;min-width:0;container-type:size;display:grid;place-items:center}
#dia{position:relative;width:min(100cqw,calc(100cqh * 5 / 3));aspect-ratio:5/3;container-type:inline-size}
#arrows{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1}
#hl{position:absolute;transform:translate(-50%,-50%);width:13.5cqw;height:13.5cqw;border-radius:50%;background:var(--pink);opacity:0;transition:opacity .4s;z-index:0}
#hl.on{opacity:1}
#hl,.num,#arrows line,#arrows polyline{transition:opacity .4s,left .5s ease,top .5s ease}
.num{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:14cqw;line-height:1;z-index:2;border-radius:3cqw;padding:0 1.5cqw;white-space:nowrap}
.num.pick{cursor:pointer;animation:hop 1.3s ease-in-out infinite;background:#fff;box-shadow:0 0 0 .6cqw var(--colInk)}
#nB.pick{animation-delay:.65s}
@keyframes hop{50%{transform:translate(-50%,-58%)}}
.lab{position:absolute;transform:translate(-50%,-50%);font-weight:800;line-height:1;white-space:nowrap;z-index:2;transition:opacity .3s}
#t10{font-size:12cqw}
#tX{font-size:6.4cqw}
.box{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);position:relative;
  background:#fff;border:3px solid var(--box);border-radius:1.6cqw}
.box .txt{position:relative;z-index:1}
#dia .box{position:absolute;transform:translate(-50%,-50%);width:16cqw;height:16cqw;font-size:12cqw;z-index:2;transition:opacity .3s}
#dia .box.pk{background:var(--pink)} #dia .box.mt{background:var(--mint)}
.box.on{border-color:#e08a1e;box-shadow:0 0 0 .9cqw #f2b63266;animation:glow 1.2s ease-in-out infinite}
.box.bad{border-color:var(--bad);color:var(--bad);animation:shake .45s}
.box.good{color:var(--ok)}
.box.on .txt:empty::before{content:"✎";opacity:.22;font-size:.62em}
.box.open:not(.on){border-style:dashed}
.ink{position:absolute;left:-28%;top:-28%;width:156%;height:156%;pointer-events:none;touch-action:none;z-index:6}
.box.on .ink,.box.open .ink{pointer-events:auto;cursor:crosshair}
.hide{opacity:0;pointer-events:none}
@keyframes glow{50%{box-shadow:0 0 0 1.6cqw #f2b63233}}
@keyframes shake{20%,60%{transform:translate(-56%,-50%)}40%,80%{transform:translate(-44%,-50%)}}

#eqWrap{flex:1;min-width:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqh;border-left:2px dashed #e4dfd2}
#eq{display:flex;align-items:center;gap:.22em;font-weight:800;font-size:min(22cqh,13cqw);line-height:1}
#eq .box{width:1.75em;height:1.2em;font-size:1em;border-radius:.16em}
#eq .box.bad{animation:shake2 .45s}
@keyframes shake2{20%,60%{transform:translateX(-6%)}40%,80%{transform:translateX(6%)}}
#helper{font-weight:700;color:var(--muted);font-size:min(13cqh,8cqw);opacity:0;transition:opacity .4s}
#helper.on{opacity:1}

/* 숫자판 */
#pad{grid-area:pad;container-type:size;display:grid;gap:1vmin;min-height:0;
  grid-template-columns:repeat(11,minmax(0,1fr)) minmax(0,1.35fr) minmax(0,2.4fr);grid-template-rows:1fr}
.k{background:var(--card);border-radius:1.6vmin;font-weight:800;font-size:min(52cqh,4.4cqw);box-shadow:0 .5vmin 0 #d8d1bf;min-height:48px;
  transition:transform .08s,opacity .2s}
.k:active{transform:translateY(.4vmin);box-shadow:0 .1vmin 0 #d8d1bf}
.k.sm{font-size:min(30cqh,2.3cqw);color:#555b68;white-space:nowrap}
.k.next{background:#3b6fd1;color:#fff;box-shadow:0 .5vmin 0 #284f9c;font-size:min(32cqh,3.3cqw);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12em}
.k.next.go{background:var(--ok);box-shadow:0 .5vmin 0 #1f7343;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.15)}}
.k.next .kb{display:none;font-size:.42em;font-weight:600;opacity:.8;border:1.5px solid currentColor;border-radius:.4em;padding:.05em .55em;line-height:1.3}
@media (hover:hover) and (pointer:fine){.k.next .kb{display:block}}
#pad.off .d{opacity:.35}

/* 세로 화면(휴대폰·세운 태블릿) */
@media (max-aspect-ratio:1/1){
  #app{grid-template-rows:auto minmax(0,.55fr) minmax(0,1.45fr) min(30vh,260px)}
  #work{flex-direction:column}
  #eqWrap{flex:0 0 26%;flex-direction:row;gap:4cqw;border-left:0;border-top:2px dashed #e4dfd2}
  #eq{font-size:min(55cqh,9.5cqw)}
  #helper{font-size:min(34cqh,5.5cqw)}
  #pad{grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr 1fr}
  .k{font-size:min(20cqh,8cqw)}
  .k.sm{font-size:min(12cqh,5cqw)}
  .k.next{grid-column:1/-1;font-size:min(14cqh,6cqw)}
  .k1{order:1}.k2{order:2}.k3{order:3}.k4{order:4}.k5{order:5}.kdel{order:6}
  .k6{order:7}.k7{order:8}.k8{order:9}.k9{order:10}.k0{order:11}.kre{order:12}.next{order:13}
}

/* 설정 서랍 */
#sheet{position:fixed;inset:0;z-index:60;background:#20232c99;display:flex;align-items:center;justify-content:center;padding:2vmin}
#sheet[hidden]{display:none}
.card{background:var(--card);border-radius:18px;padding:clamp(14px,2.6vmin,30px);width:min(700px,100%);max-height:100%;
  display:flex;flex-direction:column;gap:clamp(8px,1.6vmin,18px);font-size:clamp(13px,2.1vmin,21px)}
.card h2{font-size:1.25em}
.row{display:flex;flex-direction:column;gap:.35em}
.row>b{color:#555b68;font-size:.9em}
.seg{display:flex;flex-wrap:wrap;gap:.35em}
.seg button,.mk button{padding:.4em .85em;border-radius:999px;background:#ece7da;font-weight:700;min-height:42px}
.seg button.sel{background:#3b6fd1;color:#fff}
.mk{display:flex;align-items:center;gap:.4em;flex-wrap:wrap;font-weight:800}
.mk span.v{font-size:1.5em;width:1.5em;text-align:center}
.mk button.pm{width:44px;padding:0}
#go{background:var(--ok);color:#fff;margin-left:.4em}
#go:disabled{opacity:.4}
#mkNote{color:#b0452f;font-size:.85em;min-height:1.2em}
#close{align-self:flex-end;padding:.5em 1.4em;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;min-height:44px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.conf{position:absolute;top:-4vh;width:1.4vmin;height:2.2vmin;border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="stars"><i>★</i><span id="starN">0</span></div>
    <button id="modeChip" hidden></button>
    <div id="msg"></div>
    <button id="gear" aria-label="설정">⚙</button>
  </div>

  <div id="cubes"><div class="frame" id="frame"></div></div>

  <div id="work">
    <div id="diaWrap"><div id="dia">
      <div id="hl"></div>
      <svg id="arrows" viewBox="0 0 500 300" preserveAspectRatio="none"></svg>
      <div class="num" id="nA"></div><div class="num" id="nM">−</div><div class="num" id="nB"></div>
      <div class="lab" id="t10">10</div>
      <div class="lab" id="tX"></div>
      <div class="box" id="bP"><span class="txt"></span><canvas class="ink"></canvas></div>
      <div class="box" id="bQ"><span class="txt"></span><canvas class="ink"></canvas></div>
    </div></div>
    <div id="eqWrap">
      <div id="eq"><span id="eA"></span><span>−</span><span id="eB"></span><span>=</span><span class="box" id="bS"><span class="txt"></span><canvas class="ink"></canvas></span></div>
      <div id="helper"></div>
    </div>
  </div>

  <div id="pad">
    <button class="k d k1" data-k="1">1</button><button class="k d k2" data-k="2">2</button><button class="k d k3" data-k="3">3</button>
    <button class="k d k4" data-k="4">4</button><button class="k d k5" data-k="5">5</button><button class="k d k6" data-k="6">6</button>
    <button class="k d k7" data-k="7">7</button><button class="k d k8" data-k="8">8</button><button class="k d k9" data-k="9">9</button>
    <button class="k d k0" data-k="0">0</button><button class="k sm d kdel" data-k="del">⌫</button><button class="k sm kre" data-k="re">↺ 다시</button>
    <button class="k next" data-k="next"><span>다음 문제 ▶</span><small class="kb">스페이스 바</small></button>
  </div>
</div>

<div id="sheet" hidden><div class="card">
  <h2>10을 이용해 빼기</h2>
  <div class="row"><b>빼는 방법</b><div class="seg" data-k="mode">
    <button data-v="free">스스로 고르기</button><button data-v="A">빼는 수 가르기</button><button data-v="B">빼지는 수 가르기</button><button data-v="alt">번갈아</button></div></div>
  <div class="row"><b>문제 종류</b><div class="seg" data-k="kind">
    <button data-v="borrow">받아내림 (14−9)</button><button data-v="warm">낱개 빼기 (14−4)</button><button data-v="mix">섞어서</button></div></div>
  <div class="row"><b>빼는 수</b><div class="seg" data-k="sub">
    <button data-v="all">아무 수</button><button data-v="9">9</button><button data-v="8">8</button><button data-v="7">7</button><button data-v="6">6</button><button data-v="5">5</button></div></div>
  <div class="row"><b>문제 직접 내기</b>
    <div class="mk"><button class="pm" data-d="a-1">−</button><span class="v" id="ca">14</span><button class="pm" data-d="a1">+</button>
      <span>−</span><button class="pm" data-d="b-1">−</button><span class="v" id="cb">9</span><button class="pm" data-d="b1">+</button>
      <button id="go">이 문제로</button></div>
    <div id="mkNote"></div></div>
  <div class="row"><b>소리</b><div class="seg" data-k="sound"><button data-v="on">켜기</button><button data-v="off">끄기</button></div></div>
  <button id="close">닫기</button>
</div></div>
<div id="fx"></div>

    document.body.appendChild(cl); Drag.clone = cl; Drag.r = r;
    Drag.el.style.visibility = 'hidden'; sound(4);
  }
  Drag.clone.style.left = Drag.r.left + dx + 'px'; Drag.clone.style.top = Drag.r.top + dy + 'px';
  frame.classList.toggle('out', outside(e.clientX, e.clientY));
});
function dragEnd(e){
  if (!Drag.on || e.pointerId !== Drag.id) return;
  const D = {...Drag}; Drag.on = false; frame.classList.remove('out');
  if (!D.moved) {   // 콕 누르기 = 그 블록 빼기
    if (S.step === 'choose') choose(D.c.kind === 'loose' ? 'A' : 'B', true);
    D.c.gone = true; sound(3); render(); return;
  }
  if (e.type === 'pointerup' && outside(e.clientX, e.clientY)) {
    if (S.step === 'choose') choose(D.c.kind === 'loose' ? 'A' : 'B', true);
    D.c.gone = true; sound(3);
    const fin = () => { D.clone.remove(); render(); };
    if (reduce) fin();
    else D.clone.animate([{left: D.clone.style.left, top: D.clone.style.top, opacity:1}, {left: D.r.left + 'px', top: D.r.top + 'px', opacity:.3}],
      {duration:260, easing:'ease-out', fill:'forwards'}).onfinish = fin;   // 제자리로 돌아가 빗금 흔적이 됨
  } else {
    const back = () => { D.clone.remove(); D.el.style.visibility = ''; };
    if (reduce) back();
    else D.clone.animate([{left: D.clone.style.left, top: D.clone.style.top}, {left: D.r.left + 'px', top: D.r.top + 'px'}],
      {duration:220, easing:'ease-out', fill:'forwards'}).onfinish = back;
  }
}
frame.addEventListener('pointerup', dragEnd); frame.addEventListener('pointercancel', dragEnd);

/* ---------- 손글씨 숫자 인식 ---------- */
let NET = null;
function loadNet(){
  const bin = atob(DIGIT_W), q = new Int8Array(bin.length);
  for (let i = 0; i < bin.length; i++) q[i] = (bin.charCodeAt(i) << 24) >> 24;
  NET = {}; let off = 0;
  for (const [k, shape, s] of DIGIT_META) {
    const len = shape.reduce((a, b) => a * b, 1), f = new Float32Array(len);
    for (let i = 0; i < len; i++) f[i] = q[off + i] * s;
    off += len; NET[k] = f;
  }
}
function conv3(x, H, W, C, w, b, O){
  const out = new Float32Array(H * W * O);
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
    const o0 = (y * W + xx) * O;
    for (let o = 0; o < O; o++) out[o0 + o] = b[o];
    for (let dy = 0; dy < 3; dy++) { const yy = y + dy - 1; if (yy < 0 || yy >= H) continue;
      for (let dx = 0; dx < 3; dx++) { const xq = xx + dx - 1; if (xq < 0 || xq >= W) continue;
        const i0 = (yy * W + xq) * C, w0 = (dy * 3 + dx) * C;
        for (let c = 0; c < C; c++) { const v = x[i0 + c]; if (!v) continue;
          const wi = (w0 + c) * O; for (let o = 0; o < O; o++) out[o0 + o] += v * w[wi + o]; } } }
    for (let o = 0; o < O; o++) if (out[o0 + o] < 0) out[o0 + o] = 0;
  }
  return out;
}
function pool2(x, H, W, C){
  const H2 = H >> 1, W2 = W >> 1, out = new Float32Array(H2 * W2 * C);
  for (let y = 0; y < H2; y++) for (let xx = 0; xx < W2; xx++) for (let c = 0; c < C; c++) {
    const g = (yy, xq) => x[(yy * W + xq) * C + c];
    out[(y * W2 + xx) * C + c] = Math.max(g(2*y, 2*xx), g(2*y, 2*xx+1), g(2*y+1, 2*xx), g(2*y+1, 2*xx+1));
  }
  return out;
}
function predict(img){   // img: Float32Array(784), 0~1
  if (!NET) loadNet();
  let x = pool2(conv3(img, 28, 28, 1, NET.c1, NET.b1, 16), 28, 28, 16);
  x = pool2(conv3(x, 14, 14, 16, NET.c2, NET.b2, 32), 14, 14, 32);
  const h = new Float32Array(64);
  for (let j = 0; j < 64; j++) h[j] = NET.e1[j];
  for (let i = 0; i < 1568; i++) { const v = x[i]; if (!v) continue; for (let j = 0; j < 64; j++) h[j] += v * NET.d1[i * 64 + j]; }
  const lg = new Float32Array(10);
  for (let k = 0; k < 10; k++) { let s = NET.e2[k]; for (let j = 0; j < 64; j++) if (h[j] > 0) s += h[j] * NET.d2[j * 10 + k]; lg[k] = s; }
  const mx = Math.max(...lg); let sum = 0; const p = Array.from(lg, v => (sum += Math.exp(v - mx), Math.exp(v - mx)));
  let best = 0; for (let k = 1; k < 10; k++) if (p[k] > p[best]) best = k;
  return {d: best, p: p[best] / sum};
}
const off140 = document.createElement('canvas'); off140.width = off140.height = 140;
function toMnist(strokes){
  // MNIST처럼: 글자 상자를 20칸 크기로 맞추고, 무게중심을 가운데(14,14)로
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  strokes.forEach(st => st.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }));
  const s = 100 / Math.max(x1 - x0, y1 - y0, 1), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const g = off140.getContext('2d', {willReadFrequently:true});
  g.setTransform(1,0,0,1,0,0); g.fillStyle = '#000'; g.fillRect(0, 0, 140, 140);
  g.strokeStyle = g.fillStyle = '#fff'; g.lineWidth = 12; g.lineCap = g.lineJoin = 'round';
  strokes.forEach(st => {
    const pts = st.map(([x, y]) => [70 + (x - cx) * s, 70 + (y - cy) * s]);
    g.beginPath(); g.moveTo(...pts[0]);
    if (pts.length === 1) g.lineTo(pts[0][0] + .1, pts[0][1]);
    pts.forEach(p => g.lineTo(...p)); g.stroke();
  });
  const d = g.getImageData(0, 0, 140, 140).data, small = new Float32Array(784);
  let m = 0, mx = 0, my = 0;
  for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
    let v = 0; for (let yy = 0; yy < 5; yy++) for (let xx = 0; xx < 5; xx++) v += d[((y*5+yy) * 140 + x*5+xx) * 4];
    v = v / (25 * 255); small[y * 28 + x] = v; m += v; mx += v * x; my += v * y;
  }
  if (!m) return small;
  const sx = mx / m - 14, sy = my / m - 14, out = new Float32Array(784);
  const at = (x, y) => (x < 0 || y < 0 || x > 27 || y > 27) ? 0 : small[y * 28 + x];
  for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
    const X = x + sx, Y = y + sy, fx = Math.floor(X), fy = Math.floor(Y), ax = X - fx, ay = Y - fy;
    out[y * 28 + x] = at(fx, fy) * (1-ax) * (1-ay) + at(fx+1, fy) * ax * (1-ay) + at(fx, fy+1) * (1-ax) * ay + at(fx+1, fy+1) * ax * ay;
  }
  return out;
}
function groupStrokes(strokes, H){
  // 두 자리 수: 가로로 겹치는 획끼리 한 글자로 묶기
  const ext = strokes.map(st => { const xs = st.map(p => p[0]), ys = st.map(p => p[1]);
    return {st, a: Math.min(...xs), b: Math.max(...xs), h: Math.max(...ys) - Math.min(...ys)}; })
    .sort((p, q) => p.a - q.a);
  const groups = [];
  ext.forEach(e => {
    const g = groups[groups.length - 1];
    if (g && e.a <= g.b + H * .02) { g.st.push(e.st); g.b = Math.max(g.b, e.b); g.h = Math.max(g.h, e.h); }
    else groups.push({st:[e.st], a:e.a, b:e.b, h:e.h});
  });
  let gs = groups.filter(g => Math.max(g.b - g.a, g.h) > H * .1);   // 작은 점은 버리기
  while (gs.length > 2) {   // 가장 가까운 둘을 합치기
    let k = 0, best = 1e9;
    for (let i = 0; i < gs.length - 1; i++) { const gap = gs[i+1].a - gs[i].b; if (gap < best) { best = gap; k = i; } }
    const A = gs[k], B = gs[k+1]; gs.splice(k, 2, {st: A.st.concat(B.st), a: A.a, b: Math.max(A.b, B.b), h: Math.max(A.h, B.h)});
  }
  return gs.map(g => g.st);
}

const Ink = { box:null, strokes:[], cur:null, timer:0, id:null };
function inkCanvas(box){ return box.querySelector('.ink'); }
function inkClear(){
  clearTimeout(Ink.timer);
  if (Ink.box) { const cv = inkCanvas(Ink.box); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); }
  Ink.box = null; Ink.strokes = []; Ink.cur = null;
}
document.querySelectorAll('.box').forEach(box => {
  const cv = inkCanvas(box);
  cv.addEventListener('pointerdown', e => {
    if (busy || !writable(box)) return;
    e.preventDefault(); clearTimeout(Ink.timer);
    if (box !== activeBox()) setFocus(box);
    if (Ink.box !== box) { inkClear(); Ink.box = box; }
    if (S.input) { S.input = ''; render(); }     // 숫자판으로 쓴 것이 있으면 지우고 손글씨로
    if (!Ink.strokes.length) {
      const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
      const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.lineCap = g.lineJoin = 'round'; g.strokeStyle = '#2b2f3a'; g.lineWidth = Math.max(3, r.height * .045);
    }
    cv.setPointerCapture(e.pointerId); Ink.id = e.pointerId;
    const r = cv.getBoundingClientRect(), p = [e.clientX - r.left, e.clientY - r.top];
    Ink.cur = [p]; Ink.strokes.push(Ink.cur);
    const g = cv.getContext('2d'); g.beginPath(); g.moveTo(...p); g.lineTo(p[0] + .1, p[1]); g.stroke();
  });
  cv.addEventListener('pointermove', e => {
    if (!Ink.cur || e.pointerId !== Ink.id) return;
    const r = cv.getBoundingClientRect(), p = [e.clientX - r.left, e.clientY - r.top], q = Ink.cur[Ink.cur.length - 1];
    if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 1.5) return;
    Ink.cur.push(p);
    const g = cv.getContext('2d'); g.beginPath(); g.moveTo(...q); g.lineTo(...p); g.stroke();
  });
  const up = e => {
    if (!Ink.cur || e.pointerId !== Ink.id) return;
    Ink.cur = null; clearTimeout(Ink.timer);
    Ink.timer = setTimeout(recognize, S.step === 'answer' ? 950 : 750);
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
});
function recognize(){
  if (!Ink.strokes.length || busy || !Ink.box || !writable(Ink.box)) return;
  const H = inkCanvas(Ink.box).getBoundingClientRect().height;
  // 콕 누르기만 했으면 칸 고르기(커서)로 보고 지우기
  const pts = Ink.strokes.flat(), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  if (Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) < H * .08) { inkClear(); return; }
  const two = maxLen() === 2;
  const groups = two ? groupStrokes(Ink.strokes, H) : [Ink.strokes];
  if (!groups.length) { inkClear(); return; }
  const res = groups.map(g => predict(toMnist(g)));
  if (res.some(r => r.p < .5)) { inkClear(); sound(0); note('잘 모르겠어요. 칸에 또박또박 다시 써 볼까요?'); return; }
  const digits = res.map(r => r.d).join('');
  if (two && digits === '1') return;   // 십의 자리 1만 썼으면 다음 글자를 기다리기
  inkClear();
  S.input = digits.slice(0, maxLen()); render(); check();
}

/* ---------- 효과 ---------- */
function confetti(){
  if (reduce) return;
  const fx = $('#fx'), cols = ['#4f63d2','#3c9f4b','#f2b632','#e0533d','#9b59d0'];
  for (let i = 0; i < 46; i++) {
    const d = document.createElement('div'); d.className = 'conf';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = cols[i % cols.length];
    fx.appendChild(d);
    const drift = (Math.random() - .5) * 20;
    d.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${drift}vw,110vh) rotate(${(Math.random()*4-2)*360}deg)`}],
      {duration:1800 + Math.random() * 1400, delay:Math.random() * 400, easing:'cubic-bezier(.3,.6,.6,1)', fill:'forwards'})
      .onfinish = () => d.remove();
  }
}
let ac;
function sound(kind){
  if (S.set.sound !== 'on') return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const now = ac.currentTime;
    if (kind === 5) {   // "인정해! 그런데 다시 해 볼래?" — 따뜻한 두 음(응, 맞아) + 묻는 듯 올라가는 소리(…볼래?)
      const tone = (f0, f1, t, len, type, v) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = type; o.frequency.setValueAtTime(f0, now + t);
        if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, now + t + len * .8);
        g.gain.setValueAtTime(0, now + t); g.gain.linearRampToValueAtTime(v, now + t + .02);
        g.gain.exponentialRampToValueAtTime(.001, now + t + len);
        o.connect(g).connect(ac.destination); o.start(now + t); o.stop(now + t + len + .05);
      };
      tone(523, 523, 0, .3, 'sine', .2);          // 도
      tone(659, 659, .13, .34, 'sine', .2);       // 미  → "응, 맞아"
      tone(587, 880, .52, .32, 'triangle', .16);  // 레→라 미끄러져 올라가기 → "…해 볼래?"
      return;
    }
    const seq = {0:[[262,0],[247,.13]], 1:[[784,0],[1047,.09]], 2:[[784,0],[988,.1],[1175,.2],[1568,.32]], 3:[[660,0]], 4:[[1320,0]]}[kind];
    seq.forEach(([f, t]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = kind === 0 ? 'triangle' : 'sine'; o.frequency.value = f;
      const v = kind === 4 ? .08 : .22;
      g.gain.setValueAtTime(0, now + t); g.gain.linearRampToValueAtTime(v, now + t + .015);
      g.gain.exponentialRampToValueAtTime(.001, now + t + (kind === 4 ? .12 : .35));
      o.connect(g).connect(ac.destination); o.start(now + t); o.stop(now + t + .4);
    });
  } catch(e) {}
}



/* ---------- 크기 맞추기 ---------- */
function layoutCubes(){
  const r = $('#cubes').getBoundingClientRect(), W = r.width, H = r.height;
  // 한 줄: 숫자 + 10개 묶음 + 낱개 최대 9개 / 두 줄: 묶음 아래에 낱개
  const one = Math.min((W - 10) / 23.4, (H - 6) / 1.75);
  const two = Math.min((W - 10) / 13.4, (H - 6) / 3.05);
  const useTwo = two > one * 1.08;
  const c = Math.max(8, Math.floor(useTwo ? two : one));
  frame.classList.toggle('two', useTwo);
  document.documentElement.style.setProperty('--c', c + 'px');
}
addEventListener('resize', () => { layoutCubes(); inkClear(); });

/* ---------- 이벤트 ---------- */
$('#pad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) { b.blur(); key(b.dataset.k); } });
addEventListener('keyup', e => { if (e.key === ' ' && $('#sheet').hidden) e.preventDefault(); });
$('#gear').addEventListener('mouseup', e => e.currentTarget.blur());
addEventListener('keydown', e => {
  if (!$('#sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
  const np = /^Numpad([0-9])$/.exec(e.code);   // 숫자 패드는 NumLock이 꺼져 있어도 숫자로
  if (np) { e.preventDefault(); key(np[1]); }
  else if (/^[0-9]$/.test(e.key)) key(e.key);
  else if (e.key === 'Backspace' || e.key === 'Delete' || e.code === 'NumpadDecimal') key('del');
  else if ((e.key === 'Enter' || e.code === 'NumpadEnter') && S.step === 'done') key('next');
  else if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); if (!e.repeat) key('next'); }
});
// 수를 눌러 가르기: 빼는 수(9)를 누르면 빼는 수 가르기, 빼지는 수(14)를 누르면 빼지는 수 가르기
$('#nA').onclick = () => { if (!isWarm()) choose('B'); };
$('#nB').onclick = () => { if (!isWarm()) choose('A'); };

// 설정
let ca = 14, cb = 9;
const validPair = (a, b) => a - b >= 1 && a - b <= 10 && b >= a - 10;
function syncSheet(){
  document.querySelectorAll('.seg').forEach(g => g.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.v == S.set[g.dataset.k])));
  $('#ca').textContent = ca; $('#cb').textContent = cb;
  const ok = validPair(ca, cb);
  $('#go').disabled = !ok;
  $('#mkNote').textContent = ok ? '' : '빼는 수가 낱개보다 크거나 같고, 답이 10 이하인 문제만 낼 수 있어요.';
}
function closeSheet(){ $('#sheet').hidden = true; }
$('#gear').onclick = () => { ca = S.a; cb = S.b; syncSheet(); $('#sheet').hidden = false; };
$('#close').onclick = closeSheet;
$('#modeChip').onclick = () => $('#gear').click();
$('#sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
document.querySelectorAll('.seg').forEach(g => g.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.set[g.dataset.k] = b.dataset.v; save(); syncSheet();
  if (g.dataset.k === 'mode') start(S.a, S.b);
  else if (g.dataset.k !== 'sound') { const [a, b2] = randPair(); start(a, b2); }
});
document.querySelector('.mk').onclick = e => {
  const b = e.target.closest('[data-d]'); if (!b) return;
  const d = b.dataset.d, v = +d.slice(1);
  if (d[0] === 'a') ca = Math.min(19, Math.max(11, ca + v)); else cb = Math.min(9, Math.max(1, cb + v));
  syncSheet();
};
$('#go').onclick = () => { closeSheet(); start(ca, cb); };

start(14, 9);
requestAnimationFrame(() => { layoutCubes(); render(false); });
setTimeout(loadNet, 300);
